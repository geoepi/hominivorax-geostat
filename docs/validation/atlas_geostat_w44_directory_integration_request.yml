      - nbinomial
    fixed_effects:
      formula: >-
        Y ~ -1 + intercept1 + intercept2 + f(tier1_field, model = spde_tier1, group = tier1_field.group, control.group = list(model = "iid", hyper = pc_rw)) + f(week_steps, model = "rw1", constr = TRUE, scale.model = TRUE, hyper = pc_rw) + f(admin_f, model = "iid", constr = TRUE, hyper = pc_rw_strong) + f(tier2_field, model = spde_tier2, group = tier2_field.group, control.group = list(model = "iid", hyper = pc_rw)) + f(tier2_copy_field, copy = "tier1_field", group = tier2_copy_field.group, fixed = FALSE, hyper = hyper_copy) + f(tier2_week, model = "rw1", constr = TRUE, scale.model = TRUE, hyper = pc_rw) + f(cattle_q, cattle_mid_log1p, model = "rw2", constr = TRUE, scale.model = TRUE, hyper = pc_rw_cat) + north + road_dens + night_illum + mintemp + soilmoist + leafarea + rhum + mintemp:soilmoist + mintemp:leafarea + cattle + horses + pigs + goats + sheep
      names: [intercept1, north, road_dens, night_illum, intercept2, mintemp, soilmoist, leafarea, rhum, 'mintemp:soilmoist', 'mintemp:leafarea', cattle, horses, pigs, goats, sheep]
      order: [intercept1, intercept2, north, road_dens, night_illum, mintemp, soilmoist, leafarea, rhum, 'mintemp:soilmoist', 'mintemp:leafarea', cattle, horses, pigs, goats, sheep]
      tiers:
        tier1: [intercept1, north, road_dens, night_illum]
        tier2: [intercept2, mintemp, soilmoist, leafarea, rhum, 'mintemp:soilmoist', 'mintemp:leafarea', cattle, horses, pigs, goats, sheep]
    random_effects:
      shared_field:
        source: tier1_field
        target: tier2_copy_field
        group_model: iid
      hyperparameter_count: 10
      theta_order:
        - tier1_field:range
        - tier1_field:stdev
        - week_steps:precision
        - admin_f:precision
        - tier2_field:range
        - tier2_field:stdev
        - tier2_copy_field:coefficient
        - tier2_week:precision
        - cattle_q:precision
        - family:nbinomial:size
      effects:
        tier1_spde: tier1_field
        tier1_weekly: week_steps
        tier1_administrative: admin_f
        tier2_spde: tier2_field
        tier2_copy: tier2_copy_field
        tier2_weekly: tier2_week
        cattle: cattle_q
        likelihood: nbinomial
    priors:
      spatial:
        tier1:
          alpha: 2
          prior_range_km: 150
          prior_range_probability: 0.05
          prior_sigma: 0.5
          prior_sigma_probability: 0.05
          constr: true
        tier2:
          alpha: 2
          prior_range_km: 90
          prior_range_probability: 0.5
          prior_sigma: 1
          prior_sigma_probability: 0.5
          constr: true
      shared_field:
        enabled: true
        estimate_copy_coefficient: true
        beta_prior_mean: 0.5
        beta_prior_precision: 0.2
      temporal:
        tier1: {model: rw1, constr: true, scale_model: true}
        tier2: {model: rw1, constr: true, scale_model: true}
      administrative:
        tier1: {enabled: true, model: iid, constr: true, prior_sigma: 0.3, prior_probability: 0.01}
      livestock:
