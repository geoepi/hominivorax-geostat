      temporal_indices:
        two_week: true
        quarter: true
        six_month: true
        year: true
      spatial_prior_parameters:
        tier1: {alpha: 2, range_km: 150, range_probability: 0.05, sigma: 0.5, sigma_probability: 0.05, constrained: true}
        tier2: {alpha: 2, range_km: 90, range_probability: 0.5, sigma: 1, sigma_probability: 0.5, constrained: true}
      temporal_models: {tier1: rw1, tier2: rw1}
    transformations:
