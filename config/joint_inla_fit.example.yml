# Stage 3B runtime configuration. This file consumes the Stage 3A artifact only.

project:
  output_directory: outputs/joint_inla_fit

inputs:
  stage3a_build: outputs/joint_inla/joint_inla_build.rds

outputs:
  fit: joint_model_fit.rds
  audit: joint_model_fit_audit.csv
  metadata: joint_model_fit_metadata.rds
  theta_init: joint_model_theta_init.rds
  preflight: joint_inla_fit_preflight.csv
  # Set true, or pass --overwrite, only when replacing an existing run is intentional.
  overwrite: false

preflight:
  # Keep enabled for production. Dry-run fails before model execution on any required check.
  enabled: true

fit:
  quantiles: [0.025, 0.25, 0.5, 0.75, 0.975]
  control_fixed:
    prec: 1
    prec.intercept: 1
  control_inla:
    strategy: adaptive
    int.strategy: eb
  control_compute:
    dic: true
    cpo: false
    waic: true
  control_predictor:
    compute: true
  initialization:
    # Reuse is opt-in and requires a compatible artifact created by Stage 3B.
    mode: default
    use_previous_theta: false
    theta_file: null
  # Leave null to preserve the installed INLA nbinomial likelihood hyperprior.
  control_family: null

threads:
  num_threads: 12
  # Optional. When set, INLA receives num.threads as "num_threads:blas_threads".
  blas_threads: null

version_compatibility:
  # warn records a clear mismatch; error prevents fitting.
  policy: warn
